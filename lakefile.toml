name = "Spqr"
version = "0.1.0"
defaultTargets = ["Spqr", "SrcTranslated"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# Mathlib's header linter hardcodes the required license line ("... the file LICENSE."), which
# does not match this project's `LICENSE-APACHE`.  We disable it and use our customised version.
# When the upstream PR lands, re-enable the mathlib version.
weak.linter.style.header = false
weak.linter.style.headerAlt.license = "Released under Apache 2.0 license as described in the file LICENSE-APACHE."
maxRecDepth = 10000

[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
subDir = "backends/lean"
rev = "6e167c9b"

# Slightly modified copy of Mathlib's header linter (`linter.style.headerAlt`).  Pending the upstream
# PR which adds a config option and then this will be removed from here.
[[lean_lib]]
name = "HeaderLinter"

[[lean_lib]]
name = "SrcTranslated"

[[lean_lib]]
name = "Spqr"

[[lean_lib]]
name = "Utils"

[[lean_exe]]
name = "status"
root = "Utils.Status"
# Test suites: the project-linter `#guard_msgs` tests (`Tests.LinterTest.*`) and the
# property-based Plausible tests (`Tests.PlausibleTests.*`).  Deliberately NOT in
# `defaultTargets`, so neither the dummy `@[step]` linter theorems nor the randomized
[[lean_lib]]
name = "Tests"
