name: Request Radar

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

# This privileged workflow only reads PR metadata and posts comments.
# Never check out or execute PR code here, including for fork PRs.
#
# The comment is posted with a token of the `baif-radar` machine user
# (secret RADAR_COMMENT_TOKEN: fine-grained PAT limited to this repository
# with "Issues: read and write" and "Pull requests: read and write"). Radar only
# honours commands whose author association is allowed by its server
# configuration; `baif-radar` is an organization member, whereas
# `github-actions[bot]` comments carry association NONE and would be rejected.
permissions: {}

concurrency:
  group: radar-request-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request:
    name: Request Radar benchmark
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Evaluate current metadata inside the job so event-time metadata cannot
      # silently skip it. Ineligible PRs never reach the comment-token steps.
      - name: Check current PR eligibility
        id: eligibility
        uses: actions/github-script@v7
        with:
          script: |
            const eventPR = context.payload.pull_request;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: eventPR.number,
            });
            const reasons = [];
            if (pr.state !== 'open') reasons.push('PR is closed');
            if (pr.draft) reasons.push('PR is a draft');
            if (!['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association)) {
              reasons.push('author association is not eligible');
            }
            if (pr.head.sha !== eventPR.head.sha || pr.base.ref !== eventPR.base.ref) {
              reasons.push('event revision has been superseded');
            }
            core.info(JSON.stringify({
              event: { draft: eventPR.draft, association: eventPR.author_association },
              current: { draft: pr.draft, association: pr.author_association },
            }));
            core.setOutput('allowed', reasons.length === 0 ? 'true' : 'false');
            const message = reasons.length === 0
              ? 'Current PR is eligible for an automatic Radar request.'
              : `Radar not requested: ${reasons.join('; ')}.`;
            core.info(message);
            await core.summary.addRaw(message).write();

      - name: Check that the Radar comment token is configured
        if: steps.eligibility.outputs.allowed == 'true'
        env:
          RADAR_COMMENT_TOKEN: ${{ secrets.RADAR_COMMENT_TOKEN }}
        run: |
          if [ -z "$RADAR_COMMENT_TOKEN" ]; then
            echo "::error::Secret RADAR_COMMENT_TOKEN is not set; cannot request Radar."
            exit 1
          fi

      - name: Request benchmark for the current PR revision
        if: steps.eligibility.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RADAR_COMMENT_TOKEN }}
          script: |
            const eventPR = context.payload.pull_request;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: eventPR.number,
            });

            // A queued event may refer to a closed PR or an older revision.
            if (pr.state !== 'open' || pr.draft ||
                !['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association) ||
                pr.head.sha !== eventPR.head.sha ||
                pr.base.ref !== eventPR.base.ref) {
              const message = 'Radar not requested: PR became ineligible or event was superseded.';
              core.info(message);
              await core.summary.addRaw(message).write();
              return;
            }

            // Deduplicate against earlier requests posted by the same account
            // (the token's owner, normally `baif-radar`).
            const { data: requester } = await github.rest.users.getAuthenticated();
            const marker =
              `<!-- radar-request:${pr.base.sha}:${pr.head.sha} -->`;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...context.repo, issue_number: pr.number, per_page: 100 }
            );
            if (comments.some(c =>
                c.user?.login === requester.login &&
                c.body?.includes(marker))) {
              core.info('Radar has already been requested for this revision.');
              return;
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: pr.number,
              body: `!radar\n\n${marker}`,
            });
            await core.summary
              .addRaw('Radar requested. This check confirms only that the request ' +
                'was posted; review the baif-radar report for the current PR ' +
                'commit before approving. If no report appears, check that the ' +
                'RADAR_COMMENT_TOKEN account is accepted by Radar or request ' +
                '!radar manually.')
              .write();
